[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -ra
markers =
    unit: 纯离线单元测试 (无需网络与外部环境)
    integration: 集成测试 (组件间协同)
    real_env: 结合本机安装的 WizNote 客户端及真实的为知笔记云端服务环境测试
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
